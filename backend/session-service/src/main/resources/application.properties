spring.application.name=session-service
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/interviewos}
spring.datasource.username=${DATABASE_USER:interviewos}
spring.datasource.password=${DATABASE_PASSWORD:devpass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${PORT:8082}
orchestrator.base-url=${ORCHESTRATOR_BASE_URL:http://localhost:8000}