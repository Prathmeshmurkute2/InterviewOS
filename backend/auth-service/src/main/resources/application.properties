spring.application.name=auth-service
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/interviewos}
spring.datasource.username=${DATABASE_USER:interviewos}
spring.datasource.password=${DATABASE_PASSWORD:devpass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${PORT:8081}
jwt.secret=${JWT_SECRET:interviewOS-super-secret-jwt-signing-key-2026-dev-only}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}